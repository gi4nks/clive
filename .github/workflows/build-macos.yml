name: Build Clive for macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Check out Clive and Wise
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Install project dependencies
        run: make setup

      - name: Run frontend tests and checks
        run: |
          make frontend-test
          make frontend-check

      - name: Build app and DMG
        run: make build

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: Clive-macOS-Apple-Silicon
          path: target/release/bundle/dmg/Clive_*_aarch64.dmg
          if-no-files-found: error
