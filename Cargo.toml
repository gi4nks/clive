[package]
name = "clive"
version = "1.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-store = "2"
tokio = { features = ["full"], version = "1.38" }
dotenvy = "0.15"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "limit"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
time = "0.3"
plist = "1.10"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData", "NSDictionary", "NSObject"] }

[[bin]]
name = "clive"
path = "src-tauri/src/main.rs"
